[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -m "not integration and not e2e and not slow"
norecursedirs = .tmp tmp output logs instance web/instance .venv
markers =
    slow: tests that are intentionally time-consuming or benchmark-like
    integration: tests that require optional services or cross-component setup
    e2e: end-to-end acceptance scenarios
